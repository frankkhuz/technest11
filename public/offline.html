<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ef">
<title>You're offline · TechNest</title>
<style>
  :root { --bg:#fbf6ef; --surface:#fff; --ink:#1a1520; --soft:#6e6670; --border:rgba(26,21,32,.1); }
  @media (prefers-color-scheme: dark) { :root { --bg:#18131a; --surface:#221c22; --ink:#f7f1ea; --soft:#b0a79e; --border:rgba(255,255,255,.12); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; text-align:center; }
  .card { max-width:360px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:32px 24px; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#C2542D,#7C3AED); color:#fff; font-weight:700; font-size:26px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:var(--soft); margin:0 0 22px; font-size:15px; }
  button { width:100%; height:48px; border:0; border-radius:14px; font:inherit; font-weight:700; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#C2542D,#7C3AED); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">TN</div>
    <h1>You're offline</h1>
    <p>Check your data or Wi-Fi connection, then try again. Your cart is saved on this phone.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
